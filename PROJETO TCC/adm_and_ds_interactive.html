
<style>
*{box-sizing:border-box;margin:0;padding:0;}
.wrap{display:flex;justify-content:center;align-items:flex-start;padding:2rem 1rem;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;}
.phone{width:280px;border-radius:44px;background:#5aace0;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,0.3);}
.screen{display:none;flex-direction:column;padding:54px 20px 22px;min-height:580px;}
.screen.active{display:flex;}
.notch{width:90px;height:26px;background:#000;border-radius:0 0 16px 16px;position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:20;}
.sbar{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,0.85);margin-bottom:12px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.ic{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.22);border:none;color:white;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.ic:hover{background:rgba(255,255,255,0.35);}
.ic.blue{background:#1a5fb4;}
.ic.blue:hover{background:#1250a0;}
.stitle{color:white;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
.hero{background:rgba(255,255,255,0.18);border-radius:24px;padding:18px 16px 16px;text-align:center;margin-bottom:16px;border:1px solid rgba(255,255,255,0.22);position:relative;}
.hero-txt{color:white;font-size:15px;font-weight:500;margin-bottom:12px;}
.av{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#d4a8c7,#9b6a9e);margin:0 auto;display:flex;align-items:center;justify-content:center;border:2.5px solid white;}
.av svg{width:38px;height:38px;}
.wi{width:24px;height:24px;background:rgba(255,255,255,0.2);border-radius:50%;position:absolute;right:14px;bottom:14px;display:flex;align-items:center;justify-content:center;}
.slbl{font-size:9px;color:rgba(255,255,255,0.65);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;}
.irow{background:rgba(20,40,100,0.42);border-radius:14px;padding:0 14px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;gap:8px;transition:border .15s;}
.irow:focus-within{border:1px solid rgba(255,255,255,0.45);}
.irow input{background:transparent;border:none;outline:none;color:white;font-size:12px;font-weight:500;letter-spacing:.5px;flex:1;padding:12px 0;font-family:inherit;}
.irow input::placeholder{color:rgba(255,255,255,0.45);text-transform:uppercase;font-size:10px;letter-spacing:1px;}
.inum{min-width:22px;height:22px;background:rgba(255,255,255,0.15);border-radius:50%;font-size:10px;color:white;display:flex;align-items:center;justify-content:center;}
.btnp{background:#1a5fb4;border-radius:16px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:10px;cursor:pointer;border:none;width:100%;transition:background .15s;}
.btnp:hover{background:#1250a0;}
.btnp:active{transform:scale(.98);}
.btnp-txt{color:white;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
.bplus{width:24px;height:24px;background:rgba(255,255,255,0.2);border-radius:50%;font-size:14px;color:white;display:flex;align-items:center;justify-content:center;}
.tabs{display:flex;background:rgba(20,40,100,0.45);border-radius:24px;margin-top:16px;padding:4px;gap:2px;}
.tab{flex:1;padding:8px 0;text-align:center;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border-radius:20px;cursor:pointer;color:rgba(255,255,255,0.6);border:none;background:transparent;transition:all .2s;}
.tab.on{background:rgba(255,255,255,0.92);color:#1a5fb4;}
.tab:not(.on):hover{background:rgba(255,255,255,0.1);color:white;}
.ql{display:flex;align-items:center;gap:10px;background:rgba(20,40,100,0.42);border-radius:14px;padding:11px 14px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.1);cursor:pointer;transition:border .15s;}
.ql:hover{border:1px solid rgba(255,255,255,0.35);}
.gi{width:30px;height:30px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#4285F4;flex-shrink:0;}
.ai{width:30px;height:30px;border-radius:8px;background:rgba(10,10,10,0.88);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.qt{color:white;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;flex:1;text-align:center;}
.hbtn{background:rgba(50,120,220,0.8);border-radius:16px;padding:13px;text-align:center;cursor:pointer;border:none;width:100%;color:white;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;transition:background .15s;}
.hbtn:hover{background:rgba(50,120,220,1);}
.hbtn:active{transform:scale(.98);}
.hbtn.acc{background:rgba(90,150,230,0.55);}
.hbtn.acc:hover{background:rgba(90,150,230,0.75);}
.pcard{background:rgba(255,255,255,0.18);border-radius:22px;padding:12px 14px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.22);display:flex;align-items:center;gap:10px;position:relative;}
.ptxt{color:white;font-size:12px;font-weight:500;}
.inb{background:#0077B5;border-radius:6px;padding:4px 7px;font-size:11px;font-weight:800;color:white;margin-left:auto;}
.avrow{display:flex;align-items:center;gap:4px;margin-top:6px;}
.mav{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.55);display:flex;align-items:center;justify-content:center;font-size:7px;color:white;font-weight:700;}
.pb{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,0.22);font-size:9px;color:white;display:flex;align-items:center;justify-content:center;}
.wt{text-align:center;color:white;margin-bottom:2px;}
.wm{text-align:center;font-size:22px;font-weight:800;color:rgba(255,255,255,0.08);letter-spacing:2px;line-height:1.25;}
.cb{background:white;border-radius:12px 12px 12px 4px;padding:8px 12px;margin-left:auto;max-width:130px;margin-bottom:12px;text-align:center;}
.cbt{font-size:9px;color:#444;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.dots{display:flex;gap:4px;justify-content:center;margin-top:10px;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.35);}
.dot.on{background:white;}
.toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(20,40,100,0.9);color:white;font-size:10px;font-weight:600;letter-spacing:.5px;padding:8px 16px;border-radius:20px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;}
.toast.show{opacity:1;}
.bg1{background:linear-gradient(160deg,#b8dcf5 0%,#5aace0 45%,#2a7ed4 75%,#1a5fb4 100%);}
.bg2{background:linear-gradient(160deg,#a0ccf0 0%,#4a9cd0 40%,#1a6ec4 70%,#0e4a9e 100%);}
</style>

<div class="wrap">
<div class="phone bg1" id="phone">
  <div class="notch"></div>
  <div class="toast" id="toast"></div>

  <div class="screen active" id="s-home">
    <div class="sbar"><span>9:41</span><span>Apr 10, 2026</span><span>▪▪▪</span></div>
    <div class="pcard">
      <div class="av" style="width:44px;height:44px;flex-shrink:0;">
        <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="14" r="8" fill="#d4a8c7"/><ellipse cx="20" cy="32" rx="14" ry="9" fill="#b87ab0"/></svg>
      </div>
      <div>
        <div class="ptxt">Feito para você</div>
        <div class="avrow">
          <div class="mav" style="background:#e8a87c;">A</div>
          <div class="mav" style="background:#7cbfe8;">B</div>
          <div class="mav" style="background:#a8e87c;">C</div>
          <div class="pb">+1</div>
        </div>
      </div>
      <div class="inb">in</div>
      <div class="wi"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="2" fill="white"/><path d="M2 6 Q6 1 10 6" stroke="white" stroke-width="1.2" fill="none"/><path d="M0 6 Q6 -1 12 6" stroke="white" stroke-width="1" fill="none" opacity="0.5"/></svg></div>
    </div>
    <div class="wt"><span style="font-size:20px;font-weight:400;">Bem </span><span style="font-size:20px;font-weight:800;">Vindo</span></div>
    <div class="wm">ADM AND DS</div>
    <div class="wm" style="font-size:16px;margin-top:-4px;">ADM AND DS</div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:4px;">
      <div class="cb"><div style="font-size:8px;color:#888;margin-bottom:2px;">Que tal</div><div class="cbt">se registrar</div></div>
    </div>
    <button class="hbtn" onclick="goTo('register')">Register</button>
    <button class="hbtn" onclick="goTo('login')">Login</button>
    <button class="hbtn acc" onclick="showToast('Acessibilidade em breve!')">Acessibilidade</button>
    <div class="dots"><div class="dot on"></div><div class="dot"></div></div>
  </div>

  <div class="screen" id="s-register">
    <div class="sbar"><span>9:41</span><span></span><span>▪▪▪</span></div>
    <div class="topbar">
      <button class="ic" onclick="goTo('home')">‹</button>
      <span class="stitle">Register</span>
      <button class="ic blue" onclick="showToast('Compartilhado!')">↑</button>
    </div>
    <div class="hero">
      <div class="hero-txt">Vamos começar</div>
      <div class="av"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="14" r="8" fill="#d4a8c7"/><ellipse cx="20" cy="32" rx="14" ry="9" fill="#b87ab0"/></svg></div>
      <div class="wi"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="2" fill="white"/><path d="M2 6 Q6 1 10 6" stroke="white" stroke-width="1.2" fill="none"/><path d="M0 6 Q6 -1 12 6" stroke="white" stroke-width="1" fill="none" opacity="0.5"/></svg></div>
    </div>
    <div class="slbl">Registre-se</div>
    <div class="irow"><span class="inum">1</span><input id="r-email" type="email" placeholder="Gmail"/></div>
    <div class="irow"><span class="inum">2</span><input id="r-nome" type="text" placeholder="Nome"/></div>
    <div class="irow"><span class="inum">3</span><input id="r-senha" type="password" placeholder="Senha"/></div>
    <button class="btnp" onclick="doRegister()">
      <span class="btnp-txt">▶ Registrar</span>
      <div class="bplus">+</div>
    </button>
    <div class="tabs">
      <div class="tab on" onclick="goTo('register')">Register</div>
      <div class="tab" onclick="goTo('login')">Login</div>
    </div>
  </div>

  <div class="screen bg2" id="s-login">
    <div class="sbar"><span>9:41</span><span></span><span>▪▪▪</span></div>
    <div class="topbar">
      <button class="ic" onclick="goTo('home')">‹</button>
      <span class="stitle">Login</span>
      <button class="ic blue" onclick="showToast('Compartilhado!')">↑</button>
    </div>
    <div class="hero">
      <div class="hero-txt">Bem vindo novamente</div>
      <div class="av"><svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="14" r="8" fill="#d4a8c7"/><ellipse cx="20" cy="32" rx="14" ry="9" fill="#b87ab0"/></svg></div>
      <div class="wi"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="2" fill="white"/><path d="M2 6 Q6 1 10 6" stroke="white" stroke-width="1.2" fill="none"/><path d="M0 6 Q6 -1 12 6" stroke="white" stroke-width="1" fill="none" opacity="0.5"/></svg></div>
    </div>
    <div class="slbl">Logar</div>
    <div class="irow"><span class="inum">1</span><input id="l-email" type="email" placeholder="Gmail"/></div>
    <div class="irow"><span class="inum">2</span><input id="l-senha" type="password" placeholder="Senha"/></div>
    <div class="ql" onclick="showToast('Login com Google!')">
      <div class="gi">G</div>
      <span class="qt">Logue rápido</span>
      <div class="ai"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1C5.3 1 4 2.2 4 3.8c0 1 .5 1.8 1.2 2.3C3.3 6.7 2 8.2 2 10h10c0-1.8-1.3-3.3-3.2-3.9C9.5 5.6 10 4.8 10 3.8 10 2.2 8.7 1 7 1z" fill="white"/></svg></div>
    </div>
    <button class="btnp" onclick="doLogin()">
      <span class="btnp-txt">▶ Entre</span>
      <div class="bplus">+</div>
    </button>
    <div class="tabs">
      <div class="tab" onclick="goTo('register')">Register</div>
      <div class="tab on" onclick="goTo('login')">Login</div>
    </div>
  </div>

  <div class="screen" id="s-success">
    <div class="sbar"><span>9:41</span><span></span><span>▪▪▪</span></div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;">
      <div style="width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;">
        <svg width="36" height="36" viewBox="0 0 36 36"><path d="M6 18 L14 26 L30 10" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="color:white;font-size:18px;font-weight:700;text-align:center;" id="success-msg">Bem-vindo!</div>
      <div style="color:rgba(255,255,255,0.7);font-size:12px;text-align:center;" id="success-sub">Cadastro realizado com sucesso</div>
      <button class="hbtn" style="margin-top:20px;" onclick="goTo('home')">Voltar ao início</button>
    </div>
  </div>

</div>
</div>

<script>
var toastTimer;
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},2200);
}
function goTo(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.getElementById('s-'+id).classList.add('active');
  var p=document.getElementById('phone');
  if(id==='login'){p.className='phone bg2';}
  else{p.className='phone bg1';}
}
function doRegister(){
  var e=document.getElementById('r-email').value.trim();
  var n=document.getElementById('r-nome').value.trim();
  var s=document.getElementById('r-senha').value;
  if(!e||!n||!s){showToast('Preencha todos os campos!');return;}
  if(!e.includes('@')){showToast('Gmail inválido!');return;}
  if(s.length<6){showToast('Senha precisa ter 6+ caracteres');return;}
  document.getElementById('success-msg').textContent='Olá, '+n+'!';
  document.getElementById('success-sub').textContent='Cadastro realizado com sucesso';
  goTo('success');
}
function doLogin(){
  var e=document.getElementById('l-email').value.trim();
  var s=document.getElementById('l-senha').value;
  if(!e||!s){showToast('Preencha todos os campos!');return;}
  if(!e.includes('@')){showToast('Gmail inválido!');return;}
  document.getElementById('success-msg').textContent='Bem-vindo de volta!';
  document.getElementById('success-sub').textContent='Login realizado com sucesso';
  goTo('success');
}
</script>
