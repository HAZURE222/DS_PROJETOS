    ["Vitest","https://img.shields.io/badge/-Vitest-252529?style=for-the-badge&logo=vitest&logoColor=FCC72B","![Vitest](https://img.shields.io/badge/-Vitest-252529?style=for-the-badge&logo=vitest&logoColor=FCC72B)"],
    ["Postman","https://img.shields.io/badge/Postman-FF6C37?style=for-the-badge&logo=postman&logoColor=white","![Postman](https://img.shields.io/badge/Postman-FF6C37?style=for-the-badge&logo=postman&logoColor=white)"],
    ["Mocha","https://img.shields.io/badge/-mocha-%238D6748?style=for-the-badge&logo=mocha&logoColor=white","![Mocha](https://img.shields.io/badge/-mocha-%238D6748?style=for-the-badge&logo=mocha&logoColor=white)"],
  ],
};

let activeCategory = "all";
let searchVal = "";

const allBadges = [];
Object.entries(DATA).forEach(([cat, badges]) => {
  badges.forEach(b => allBadges.push({ cat, name: b[0], img: b[1], md: b[2] }));
});

function copyToClipboard(md) {
  navigator.clipboard.writeText(md).then(() => {
    const t = document.getElementById("toast");
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1800);
  });
}

function render() {
  const q = searchVal.toLowerCase().trim();
  const content = document.getElementById("content");
  const noRes = document.getElementById("no-results");
  const stats = document.getElementById("stats");

  let total = 0;
  let html = "";

  Object.entries(DATA).forEach(([cat, badges]) => {
    if (activeCategory !== "all" && cat !== activeCategory) return;
    const filtered = badges.filter(b => !q || b[0].toLowerCase().includes(q));
    if (!filtered.length) return;
    total += filtered.length;
    html += `<div class="section">
      <div class="section-title">${cat}</div>
      <div class="badges-grid">`;
    filtered.forEach(b => {
      html += `<div class="badge-item" onclick="copyToClipboard('${b[2].replace(/'/g,"\\'")}')">
        <img src="${b[1]}" alt="${b[0]}" loading="lazy" onerror="this.style.display='none'" />
        <span class="badge-name">${b[0]}</span>
      </div>`;
    });
    html += `</div></div>`;
  });

  content.innerHTML = html || "";
  noRes.style.display = html ? "none" : "block";
  stats.textContent = `${total} badges — clique em qualquer um para copiar o Markdown`;
}

function buildNav() {
  const nav = document.getElementById("cat-nav");
  const categories = ["all", ...Object.keys(DATA)];
  nav.innerHTML = categories.map(c => `
    <button class="cat-btn${c === activeCategory ? " active" : ""}" onclick="setCategory('${c}')">
      ${c === "all" ? "Todas" : c}
    </button>
  `).join("");
}

window.setCategory = function(c) {
  activeCategory = c;
  buildNav();
  render();
};

window.copyToClipboard = copyToClipboard;

document.getElementById("search").addEventListener("input", e => {
  searchVal = e.target.value;
  if (searchVal) activeCategory = "all";
  buildNav();
  render();
});

buildNav();
render();
</script>
