<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarcaViva - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="auth-split-container">
        
        <!-- LADO ESQUERDO: Imagem Estratégica -->
        <div class="auth-side-text">
            <div class="overlay-content">
                <h1>Decisões estratégicas geram marcas fortes.</h1>
                <p>Faça escolhas alinhadas com o comportamento do seu cliente e destaque sua empresa no mercado.</p>
            </div>
        </div>

        <!-- LADO DIREITO: Área de Login -->
        <div class="auth-form-side">
            
            <!-- Botão Voltar posicionado no canto superior -->
            <a href="main.html" class="btn-voltar-topo" title="Voltar para a página inicial">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                <span>Voltar</span>
            </a>

            <div class="login-box">
                <div class="login-header">
                    <h2>Bem-vindo de volta! 👋</h2>
                    <p>Faça login para continuar na sua conta.</p>
                </div>

                <form>
                    <div class="input-wrapper">
                        <label>E-mail</label>
                        <input type="email" placeholder="seu@email.com" required>
                    </div>
                    
                    <div class="input-wrapper">
                        <label>Senha</label>
                        <input type="password" placeholder="********" required>
                    </div>
                    
                    <button type="submit" class="btn-entrar">Acessar Painel</button>
                </form>

                <div class="links-footer">
                    <a href="#">Esqueceu sua senha?</a>
                    <div class="divider">ou</div>
                    <p>Novo por aqui? <a href="#" class="signup-link">Crie uma conta</a></p>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
